<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1565C0">
    <link rel="manifest" href="manifest.json">
    <title>English Learning</title>
    <script>
    try {
        if ('serviceWorker' in navigator && location.protocol === 'https:') {
            navigator.serviceWorker.register('sw.js').catch(function(){});
        }
    } catch(e) {}
    </script>
    <style>
        /* ===== 基础重置 ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #F0F6FC; color: #212121; min-height: 100vh; }

        /* ===== 导航栏 ===== */
        .navbar { background: #1565C0; color: #fff; position: fixed; top: 0; left: 0; right: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .nav-title { font-size: 20px; font-weight: 700; padding: 16px 20px 12px; text-align: center; letter-spacing: 2px; }
        .nav-tabs { display: flex; justify-content: center; gap: 4px; padding: 0 12px; }
        .nav-tab { background: transparent; border: none; color: rgba(255,255,255,0.75); font-size: 15px; padding: 10px 18px; cursor: pointer; border-radius: 8px 8px 0 0; font-family: inherit; transition: all 0.2s; min-height: 44px; }
        .nav-tab:hover { color: #fff; background: rgba(255,255,255,0.1); }
        .nav-tab.active { background: #F0F6FC; color: #1565C0; font-weight: 600; }

        /* ===== 主容器 ===== */
        .container { max-width: 600px; margin: 0 auto; padding: 120px 16px 32px; }

        /* ===== 面板 ===== */
        .panel { display: none; }
        .panel.active { display: block; }

        /* ===== 卡片 ===== */
        .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 24px; margin-bottom: 16px; }
        .card-title { font-size: 18px; font-weight: 600; color: #212121; margin-bottom: 12px; }

        /* ===== 按钮 ===== */
        .btn { display: inline-flex; align-items: center; justify-content: center; border: none; border-radius: 8px; font-size: 15px; font-family: inherit; cursor: pointer; min-height: 44px; padding: 10px 20px; transition: all 0.2s; }
        .btn-primary { background: #1976D2; color: #fff; }
        .btn-primary:hover { background: #1565C0; }
        .btn-outline { background: #fff; color: #1976D2; border: 1.5px solid #1976D2; }
        .btn-outline:hover { background: #E3F2FD; }
        .btn-success { background: #4CAF50; color: #fff; }
        .btn-success:hover { background: #43A047; }
        .btn-danger { background: #F44336; color: #fff; }
        .btn-danger:hover { background: #E53935; }
        .btn-sm { min-height: 36px; padding: 6px 14px; font-size: 13px; }
        .btn-block { display: flex; width: 100%; }
        .btn-group { display: flex; gap: 10px; margin-top: 16px; }

        /* ===== 进度条 ===== */
        .progress-bar { height: 8px; background: #E0E0E0; border-radius: 4px; overflow: hidden; margin: 8px 0 4px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #1976D2, #42A5F5); border-radius: 4px; transition: width 0.4s ease; }
        .progress-text { font-size: 13px; color: #757575; text-align: right; }

        /* ===== 表单 ===== */
        .form-group { margin-bottom: 14px; }
        .form-label { display: block; font-size: 14px; color: #757575; margin-bottom: 4px; }
        .form-input { width: 100%; padding: 10px 14px; border: 1.5px solid #E0E0E0; border-radius: 8px; font-size: 15px; font-family: inherit; min-height: 44px; transition: border-color 0.2s; }
        .form-input:focus { outline: none; border-color: #1976D2; box-shadow: 0 0 0 3px rgba(25,118,210,0.12); }

        /* ===== 单词卡片 ===== */
        .word-card { cursor: pointer; user-select: none; min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transition: transform 0.3s, background 0.3s; position: relative; }
        .word-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
        .word-card.flipped { background: #F8FBFF; }
        .word-en { font-size: 32px; font-weight: 700; color: #1565C0; letter-spacing: 1px; }
        .word-phonetic { font-size: 16px; color: #757575; margin-top: 6px; }
        .word-pos { font-size: 14px; color: #1976D2; background: #E3F2FD; padding: 2px 10px; border-radius: 12px; margin-top: 8px; }
        .word-meaning { font-size: 20px; color: #212121; margin-top: 8px; }
        .word-example { font-size: 14px; color: #757575; margin-top: 8px; font-style: italic; }
        .flip-hint { font-size: 12px; color: #90CAF9; margin-top: 14px; }
        .memory-tip { margin-top: 16px; padding: 12px 16px; background: #FFF8E1; border-radius: 10px; border-left: 4px solid #FFB74D; font-size: 13px; line-height: 1.7; color: #555; text-align: left; width: 100%; }

        /* ===== 复习 ===== */
        .quiz-options { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
        .quiz-option { background: #fff; border: 2px solid #E0E0E0; border-radius: 10px; padding: 14px 18px; font-size: 16px; cursor: pointer; transition: all 0.2s; min-height: 48px; font-family: inherit; text-align: left; }
        .quiz-option:hover { border-color: #1976D2; background: #E3F2FD; }
        .quiz-option.correct { border-color: #4CAF50; background: #E8F5E9; color: #2E7D32; pointer-events: none; }
        .quiz-option.wrong { border-color: #F44336; background: #FFEBEE; color: #C62828; pointer-events: none; }

        /* ===== 语法 ===== */
        .grammar-category { margin-bottom: 12px; }
        .grammar-header { background: #fff; border-radius: 10px; padding: 16px 20px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,0.06); transition: background 0.2s; }
        .grammar-header:hover { background: #E3F2FD; }
        .grammar-body { background: #fff; border-radius: 0 0 10px 10px; padding: 0 20px; margin-top: -4px; overflow: hidden; max-height: 0; transition: max-height 0.3s ease, padding 0.3s ease; }
        .grammar-body.open { max-height: 500px; padding: 16px 20px; }

        /* ===== 设置 ===== */
        .settings-btn { position: fixed; top: 14px; right: 16px; z-index: 101; background: rgba(255,255,255,0.2); border: none; color: #fff; font-size: 20px; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .settings-btn:hover { background: rgba(255,255,255,0.3); }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 200; display: flex; align-items: center; justify-content: center; animation: fadeIn 0.2s ease; }
        .modal-content { background: #fff; border-radius: 12px; padding: 24px; width: 90%; max-width: 420px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .btn-close { background: none; border: none; font-size: 24px; color: #757575; cursor: pointer; padding: 4px 8px; border-radius: 6px; line-height: 1; }
        .btn-close:hover { background: #F5F5F5; color: #212121; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* ===== 其他 ===== */
        .empty-state { text-align: center; padding: 48px 20px; color: #757575; }
        .empty-state-icon { font-size: 48px; margin-bottom: 12px; }
        .empty-state-text { font-size: 16px; }
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #212121; color: #fff; padding: 10px 24px; border-radius: 20px; font-size: 14px; z-index: 300; animation: fadeInUp 0.3s ease; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        .stat-row { display: flex; gap: 12px; margin: 16px 0; }
        .stat-item { flex: 1; background: #E3F2FD; border-radius: 10px; padding: 14px; text-align: center; }
        .stat-num { font-size: 24px; font-weight: 700; color: #1565C0; }
        .stat-label { font-size: 12px; color: #757575; margin-top: 2px; }
        .wordbook-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #F0F0F0; }
        .wordbook-item:last-child { border-bottom: none; }
        .badge { font-size: 11px; background: #E3F2FD; color: #1976D2; padding: 2px 8px; border-radius: 10px; }
        .badge-learned { background: #E8F5E9; color: #2E7D32; }
        .badge-review { background: #FFF3E0; color: #E65100; }

        /* ===== 不认识按钮 ===== */
        .btn-learn-unknown { background: #FFF3E0; color: #E65100; border: 1.5px solid #FFB74D; }
        .btn-learn-unknown:hover { background: #FFE0B2; }

        /* ===== 词库列表 ===== */
        .vocab-item { display: flex; align-items: flex-start; padding: 10px 12px; border-bottom: 1px solid #F0F0F0; gap: 10px; }
        .vocab-item:last-child { border-bottom: none; }
        .vocab-item-left { flex: 1; min-width: 0; }
        .vocab-word-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 3px; }
        .vocab-word { font-size: 16px; font-weight: 600; color: #1565C0; }
        .vocab-meaning { font-size: 14px; color: #555; }
        .vocab-status { font-size: 11px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }

        @media (max-width: 480px) {
            .container { padding: 110px 10px 24px; }
            .card { padding: 18px; }
            .word-en { font-size: 26px; }
        }
    </style>
</head>
<body>

    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="nav-title">English Learning</div>
        <div class="nav-tabs">
            <button class="nav-tab active" data-tab="learn">学习</button>
            <button class="nav-tab" data-tab="review">复习<span id="reviewBadge" style="display:none;background:#F44336;color:#fff;font-size:11px;padding:1px 6px;border-radius:10px;margin-left:4px;vertical-align:top;"></span></button>
            <button class="nav-tab" data-tab="wordbook">生词本</button>
            <button class="nav-tab" data-tab="grammar">语法</button>
            <button class="nav-tab" data-tab="vocab">词库</button>
        </div>
    </nav>

    <!-- 设置按钮 -->
    <button class="settings-btn" id="btnSettings" title="设置">&#9881;</button>

    <!-- 设置弹窗 -->
    <div class="modal-overlay" id="settingsModal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <span class="card-title">设置</span>
                <button class="btn-close" id="btnCloseSettings">&times;</button>
            </div>
            <div class="form-group">
                <label class="form-label">每日目标（个）</label>
                <input class="form-input" type="number" id="inputDailyGoal" min="5" max="100" value="20">
            </div>
            <button class="btn btn-primary btn-block" id="btnSaveGoal" style="margin-bottom:8px;">保存目标</button>
            <hr style="border:none;border-top:1px solid #E0E0E0;margin:16px 0;">
            <div class="btn-group">
                <button class="btn btn-outline btn-block" id="btnExport">导出数据备份</button>
                <button class="btn btn-outline btn-block" id="btnImport">导入数据恢复</button>
            </div>
            <input type="file" id="importFile" accept=".json" style="display:none;">
            <hr style="border:none;border-top:1px solid #E0E0E0;margin:16px 0;">
            <button class="btn btn-danger btn-block" id="btnReset">重置所有数据</button>
        </div>
    </div>

    <!-- 内容区 -->
    <main class="container">

        <!-- ===== 学习面板 ===== -->
        <section id="learn-panel" class="panel active">
            <div class="card word-card" id="wordCard">
                <div style="position:absolute;top:12px;right:14px;cursor:pointer;font-size:22px;color:#1976D2;z-index:5;" id="btnSpeak" title="点击听发音">&#128266;</div>
                <div class="word-en" id="wordEn"></div>
                <div class="word-phonetic" id="wordPhonetic"></div>
                <div class="word-pos" id="wordPos"></div>
                <div class="word-meaning" id="wordMeaning"></div>
                <div style="display:flex;align-items:flex-start;gap:6px;justify-content:center;">
                    <div class="word-example" id="wordExample"></div>
                    <span id="btnSpeakExample" style="cursor:pointer;font-size:16px;color:#1976D2;display:none;line-height:1.4;" title="听例句发音">&#128266;</span>
                </div>
                <div class="flip-hint" id="flipHint">点击卡片翻转查看释义</div>
                <div class="memory-tip" id="memoryTipBox" style="display:none;">
                    <div style="font-weight:600;color:#E65100;margin-bottom:4px;">&#128161; 记忆技巧</div>
                    <div id="memoryTipContent"></div>
                </div>
            </div>
            <div class="btn-group" id="learnBtnGroup">
                <button class="btn btn-outline btn-block" id="btnPrevWord">上一个</button>
                <button class="btn btn-learn-unknown btn-block" id="btnUnknown">不认识</button>
                <button class="btn btn-primary btn-block" id="btnLearned">认识了</button>
            </div>
            <div class="card" id="completeCard" style="display:none;">
                <div class="empty-state">
                    <div class="empty-state-icon">&#127881;</div>
                    <div class="empty-state-text">今日目标已完成！继续复习巩固吧</div>
                </div>
            </div>
            <!-- 今日已学列表 -->
            <div class="card" id="todayLearnedCard">
                <div class="card-title">今日已学（<span id="todayLearnedCount">0</span> 词）</div>
                <div id="todayLearnedList" style="font-size:14px;color:#555;line-height:2;"></div>
                <div class="empty-state" id="todayLearnedEmpty" style="padding:16px;">
                    <div class="empty-state-text" style="font-size:14px;">今天还没有学词，开始吧</div>
                </div>
            </div>
        </section>

        <!-- ===== 复习面板 ===== -->
        <section id="review-panel" class="panel">
            <div class="stat-row" id="quizStats">
                <div class="stat-item"><div class="stat-num" id="quizCorrect" style="color:#4CAF50;">0</div><div class="stat-label">正确</div></div>
                <div class="stat-item"><div class="stat-num" id="quizWrong" style="color:#F44336;">0</div><div class="stat-label">错误</div></div>
                <div class="stat-item"><div class="stat-num" id="quizTotal">0</div><div class="stat-label">总题数</div></div>
            </div>
            <div class="card" id="quizCard">
                <div class="card-title">选择正确的释义</div>
                <div style="text-align:center;font-size:28px;font-weight:700;color:#1565C0;padding:16px 0;cursor:pointer;" id="quizWord" title="点击听发音">--</div>
                <div class="quiz-options" id="quizOptions"></div>
                <div id="quizFeedback" style="text-align:center;margin-top:12px;font-size:14px;"></div>
                <div class="btn-group" id="quizNavBtns" style="display:none;">
                    <button class="btn btn-outline btn-block" id="btnPrevQuiz">上一题</button>
                    <button class="btn btn-primary btn-block" id="btnNextQuiz">下一题</button>
                </div>
            </div>
            <div class="card" id="quizEmpty" style="display:none;">
                <div class="empty-state">
                    <div class="empty-state-icon">&#128218;</div>
                    <div class="empty-state-text">先去学习页认识一些单词，再来复习吧</div>
                </div>
            </div>
        </section>

        <!-- ===== 生词本面板 ===== -->
        <section id="wordbook-panel" class="panel">
            <div class="card">
                <div class="card-title">添加生词</div>
                <div class="form-group"><input class="form-input" id="inputNewWord" placeholder="输入英文单词"></div>
                <div class="form-group"><input class="form-input" id="inputNewMeaning" placeholder="输入中文释义"></div>
                <button class="btn btn-primary btn-block" id="btnAddWord">添加</button>
            </div>
            <!-- 生词测试 -->
            <div class="card" id="wordbookQuizCard">
                <div class="card-title">生词测试</div>
                <div id="wbQuizArea">
                    <button class="btn btn-primary btn-block" id="btnStartWbQuiz">开始测试生词</button>
                </div>
                <div id="wbQuizQuestion" style="display:none;">
                    <div style="text-align:center;font-size:26px;font-weight:700;color:#1565C0;padding:12px 0;cursor:pointer;" id="wbQuizWord" title="点击听发音"></div>
                    <div class="quiz-options" id="wbQuizOptions"></div>
                    <div id="wbQuizFeedback" style="text-align:center;margin-top:10px;font-size:14px;"></div>
                    <div class="btn-group" id="wbQuizNavBtns" style="display:none;">
                        <button class="btn btn-outline btn-block" id="btnWbPrev">上一题</button>
                        <button class="btn btn-primary btn-block" id="btnWbNext">下一题</button>
                    </div>
                    <div id="wbQuizResult" style="display:none;text-align:center;padding:20px;"></div>
                </div>
            </div>
            <!-- 生词列表 -->
            <div class="card">
                <div class="card-title">生词列表（<span id="wbErrorCount">0</span> 个错误词）</div>
                <div id="wordbookList"></div>
                <div class="empty-state" id="wordbookEmpty">
                    <div class="empty-state-icon">&#128214;</div>
                    <div class="empty-state-text">还没有生词，不认识或答错的词会自动收录</div>
                </div>
            </div>
        </section>

        <!-- ===== 语法面板 ===== -->
        <section id="grammar-panel" class="panel">
            <div id="grammarContent"></div>
        </section>

        <!-- ===== 词库面板 ===== -->
        <section id="vocab-panel" class="panel">
            <div class="card">
                <input class="form-input" id="vocabSearch" placeholder="搜索单词...（输入英文或中文）">
                <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;" id="vocabFilters">
                    <button class="btn btn-sm btn-outline vocab-filter active" data-cat="all">全部</button>
                    <button class="btn btn-sm btn-outline vocab-filter" data-cat="mustknow" style="color:#F44336;border-color:#F44336;">必考</button>
                    <button class="btn btn-sm btn-outline vocab-filter" data-cat="highfreq" style="color:#1976D2;border-color:#1976D2;">高频</button>
                    <button class="btn btn-sm btn-outline vocab-filter" data-cat="errorprone" style="color:#E65100;border-color:#E65100;">易错</button>
                    <button class="btn btn-sm btn-outline vocab-filter" data-cat="basic">基础</button>
                </div>
            </div>
            <div class="card">
                <div class="card-title">单词列表（<span id="vocabCount">500</span> 词）</div>
                <div id="vocabList"></div>
            </div>
        </section>

    </main>

    <script>
    // ===== 兼容补丁（旧手机浏览器） =====
    if (!Array.prototype.find) {
        Array.prototype.find = function(cb) {
            for (var i = 0; i < this.length; i++) { if (cb(this[i], i, this)) return this[i]; }
        };
    }
    if (!Array.prototype.some) {
        Array.prototype.some = function(cb) {
            for (var i = 0; i < this.length; i++) { if (cb(this[i], i, this)) return true; }
            return false;
        };
    }
    if (!String.prototype.includes) {
        String.prototype.includes = function(s) { return this.indexOf(s) !== -1; };
    }
    if (!Array.prototype.includes) {
        Array.prototype.includes = function(v) { return this.indexOf(v) !== -1; };
    }
    if (!window.speechSynthesis) { window.speechSynthesis = null; }

    // ===================================================================
    // 四级词库数据
    // ===================================================================
    var WORDS = [
        { id: "w001", word: "abandon", phonetic: "/əˈbændən/", pos: "v.", meaning: "放弃；抛弃", example: "He had to abandon his plan.", memoryTip: "<b>谐音：</b>\"一笨蛋\" → 被当笨蛋<b>抛弃</b>了。a+band+on：乐队在台上演出，观众走光了。" },
        { id: "w002", word: "ability", phonetic: "/əˈbɪləti/", pos: "n.", meaning: "能力；才能", example: "She has the ability to lead." },
        { id: "w003", word: "abroad", phonetic: "/əˈbrɔːd/", pos: "adv.", meaning: "在国外；到国外", example: "He dreams of studying abroad." },
        { id: "w004", word: "absence", phonetic: "/ˈæbsəns/", pos: "n.", meaning: "缺席；不在", example: "His absence was noticed." },
        { id: "w005", word: "absolute", phonetic: "/ˈæbsəluːt/", pos: "adj.", meaning: "绝对的；完全的", example: "I have absolute trust in her." },
        { id: "w006", word: "absorb", phonetic: "/əbˈzɔːrb/", pos: "v.", meaning: "吸收；吸引", example: "Plants absorb sunlight." },
        { id: "w007", word: "abstract", phonetic: "/ˈæbstrækt/", pos: "adj.", meaning: "抽象的；摘要", example: "The idea is too abstract." },
        { id: "w008", word: "abundant", phonetic: "/əˈbʌndənt/", pos: "adj.", meaning: "丰富的；充裕的", example: "The region has abundant resources." },
        { id: "w009", word: "academic", phonetic: "/ˌækəˈdemɪk/", pos: "adj.", meaning: "学术的；学院的", example: "She has high academic achievements." },

        // ===== 时态 =====

        { id: "g14", category: "非谓语动词", title: "分词作状语",
            content: "分词（现在分词 -ing / 过去分词 -ed）在句中作状语，表示时间、原因、条件、伴随等。这是四级阅读长难句的核心分析工具。<br><br><b>核心原则：分词与主句主语的关系——</b><br>主动关系（主语做这个动作）→ 现在分词 (-ing)<br>被动关系（主语承受这个动作）→ 过去分词 (-ed)<br>先于谓语发生 → having + 过去分词 (完成式)<br><br><b>独立主格结构：</b>分词有自己的逻辑主语，与主句主语不同。",
            example: "<b>Walking</b> along the street, I met an old friend.（走在街上时我遇到了老朋友——我走，主动，用 -ing。）<br><b>Seen</b> from the top of the hill, the city looks beautiful.（从山顶看，城市很美——城市被看，被动，用 -ed。）<br><b>Having finished</b> his homework, he went out to play.（先做完作业再出去玩——先于谓语，用 having done。）",
            examPoint: "四级常考：当分词逻辑主语与主句主语不一致时，形成\"悬垂分词\"，这是错误用法。<br>错误：Waiting for the bus, a car hit him.（等公交车的是人，但主语是 car，逻辑不通。）<br>正确：While he was waiting for the bus, a car hit him.",
            pitfall: "易错：judging from / generally speaking / considering / regarding 等固定表达不受逻辑主语限制。<br><b>Judging from</b> his accent, he is from the south.（从他的口音判断他是南方人——正确，这是固定用法。）" },

        // ===== 情态动词 =====
        { id: "g16", category: "情态动词", title: "must / can / may 表推测",
            content: "情态动词可表示推测，把握程度从高到低：<br><b>must do</b>（肯定/一定，把握最大，只用于肯定句）<br><b>may/might do</b>（可能，maybe）<br><b>could do</b>（有可能）<br><b>can't do</b>（不可能，否定推测用 can't，不用 mustn't）<br><br><b>对过去的推测：</b>must/may/might/could + have + 过去分词",
            example: "He <b>must be</b> at home now. The light is on.（他现在肯定在家，灯亮着。）<br>She <b>can't have received</b> my message. She hasn't replied.（她不可能收到我的消息，她还没回复。）<br>He <b>may have missed</b> the bus.（他可能错过了公交车。）",
            examPoint: "四级常考：should have done（本应该做而没做）；shouldn't have done（本不该做却做了）；needn't have done（本不必做却做了）。<br>You <b>should have told</b> me earlier.（你本应该早点告诉我。）<br>You <b>needn't have bought</b> the gift.（你本不必买礼物的。）",
            pitfall: "易错：mustn't 表示\"禁止/不准\"，不是\"不必\"。<br>You <b>mustn't</b> smoke here.（这里不准抽烟。）<br>你不必来 → You <b>needn't</b> come. / You <b>don't have to</b> come." },

        // ===== 倒装 =====
        { id: "g15", category: "倒装", title: "倒装句（重难点）",
            content: "<b>全部倒装：</b>整个谓语提到主语前。常用于 here/there/now/then 开头的句子，以及表示方位的介词短语位于句首（如 On the wall hangs a picture）。<br><br><b>部分倒装：</b>只把助动词/情态动词提到主语前。这是四级考查重点：<br>①否定词/半否定词置于句首：never, hardly, scarcely, rarely, seldom, little, nowhere, by no means, in no case, at no time, under no circumstances<br>②only + 状语（副词/介词短语/状语从句）位于句首<br>③not only...but also 连接句子时 not only 部分倒装<br>④so/neither/nor 表\"也\"",
            example: "<b>Never</b> have I seen such a beautiful sunset.（我从没见过这么美的日落。）<br><b>Only</b> by working hard can you achieve success.（只有努力工作你才能成功。）<br><b>Not only</b> did he pass the exam, but he also got the highest score.（他不仅通过了考试，还拿了最高分。）<br><b>So</b> beautiful was the view that we stopped to take photos.（风景太美了，我们停下来拍照。）",
            examPoint: "四级必考：hardly/scarcely...when, no sooner...than（一…就…），主句过去完成时倒装。<br><b>Hardly had</b> I entered the room <b>when</b> the phone rang.<br><b>No sooner had</b> we sat down <b>than</b> the show began.",
            pitfall: "易错：only 修饰状语才倒装，修饰主语不倒装。<br>Only by this way can you solve the problem.（only + 状语，倒装——正确。）<br>Only he knows the truth.（only + 主语，不倒装——正确。）" },

        // ===== 主谓一致 =====
        { id: "g17", category: "主谓一致", title: "主谓一致",
            content: "谓语动词的单复数必须与主语一致，这是四级写作的基础分。<br><br><b>核心规则：</b><br>①不定式/动名词/从句作主语 → 单数<br>②each/every/either/neither + 名词 → 单数<br>③a number of + 复数名词 → 复数谓语；the number of → 单数谓语<br>④the + 形容词（表一类人）→ 复数<br>⑤就近原则：either...or, neither...nor, not only...but also 谓语与最近的主语一致<br>⑥就远原则：together with, along with, as well as, rather than, besides, except 谓语与前面的主语一致",
            example: "<b>A number of</b> students <b>are</b> in the library.（许多学生在图书馆。）<br><b>The number of</b> students <b>is</b> 500.（学生数量是500。）<br>Neither he nor I <b>am</b> wrong.（他和我都没错——就近，与 I 一致。）<br>The teacher together with his students <b>is</b> going on a trip.（老师和学生们一起去旅行——就远，与 teacher 一致。）",
            examPoint: "四级常考：分数/百分数 + of + 名词，谓语与名词一致。<br>Two-thirds of the water <b>is</b> polluted.（water 不可数 → 单数。）<br>Two-thirds of the students <b>are</b> from China.（students 可数 → 复数。）",
            pitfall: "易错：the number of 和 a number of 的区分是每年必考的坑。<br>the number of + 复数名词 + 单数动词（…的数量）<br>a number of + 复数名词 + 复数动词（许多…）" },

        // ===== 比较结构 =====
        { id: "g18", category: "比较结构", title: "比较级与最高级",
            content: "<b>比较级：</b>两者相比。单音节词 +er，多音节词用 more + 原级。常见标志词：than。<br><b>最高级：</b>三者及以上。单音节词 +est，多音节词用 most + 原级。常加 the。<br><br><b>重要句型：</b><br>as + 原级 + as（和…一样）<br>not as/so + 原级 + as（不如…）<br>比较级 + and + 比较级（越来越…）<br>the + 比较级, the + 比较级（越…就越…）",
            example: "She is <b>taller than</b> her sister.（她比姐姐高。）<br>This is <b>the most interesting</b> movie I've ever seen.（这是我看过最有趣的电影。）<br><b>The more</b> you practice, <b>the better</b> you become.（练习越多，你就变得越好。）",
            examPoint: "四级常考：比较级前可用 much, far, a lot, a little, a bit, even, still 等修饰表示程度。<br>This problem is <b>much more</b> difficult than that one.（这道题比那道难得多。）",
            pitfall: "易错：比较对象要一致，不能把一个人的身高和另一个人比。<br>错误：The weather in Beijing is colder than Shanghai.<br>正确：The weather in Beijing is colder than <b>that in</b> Shanghai.（that 代替前面的 the weather。）" }
    ];

    // ===================================================================
    // localStorage 存储
    // ===================================================================
    var Storage = {
        get: function(key, fallback) {
            try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
            catch(e) { return fallback; }
        },
        set: function(key, value) {
            try { localStorage.setItem(key, JSON.stringify(value)); return true; }
            catch(e) { return false; }
        },
        getWordsProgress: function() { return this.get('cet4_progress', {}); },
        saveWordsProgress: function(p) { return this.set('cet4_progress', p); },
        getWordStatus: function(id) {
            var p = this.getWordsProgress();
            return p[id] || { status: 'new', correct: 0, wrong: 0, lastReview: null };
        },
        updateWordStatus: function(id, updates) {
            var p = this.getWordsProgress();
            var cur = p[id] || { status: 'new', correct: 0, wrong: 0, lastReview: null };
            for (var k in updates) { cur[k] = updates[k]; }
            p[id] = cur;
            return this.saveWordsProgress(p);
        },
        getLearnedWordIds: function() {
            var p = this.getWordsProgress();
            return Object.keys(p).filter(function(id) { return p[id].status === 'learned'; });
        },
        getNeedReviewIds: function() {
            var p = this.getWordsProgress();
            return Object.keys(p).filter(function(id) { return p[id].status === 'need_review'; });
        },
        getReviewableIds: function() {
            var today = new Date().toISOString().slice(0, 10);
            var p = this.getWordsProgress();
            return Object.keys(p).filter(function(id) {
                var s = p[id];
                return (s.status === 'learned' || s.status === 'need_review') && s.lastReview === today;
            });
        },
        getDailyStats: function() { return this.get('cet4_daily', {}); },
        getTodayStats: function() {
            var today = new Date().toISOString().slice(0, 10);
            var s = this.getDailyStats();
            return s[today] || { learned: 0, reviewed: 0 };
        },
        incTodayLearned: function(wordId, countIt) {
            var today = new Date().toISOString().slice(0, 10);
            var s = this.getDailyStats();
            if (!s[today]) s[today] = { learned: 0, reviewed: 0, learnedIds: [] };
            if (!s[today].learnedIds) s[today].learnedIds = [];
            if (countIt !== false) s[today].learned++;
            if (s[today].learnedIds.indexOf(wordId) === -1) s[today].learnedIds.push(wordId);
            return this.set('cet4_daily', s);
        },
        getTodayLearnedIds: function() {
            var today = new Date().toISOString().slice(0, 10);
            var s = this.getDailyStats();
            return (s[today] && s[today].learnedIds) ? s[today].learnedIds : [];
        },
        // 艾宾浩斯：计算下次复习日期
        getEbbinghausNextDate: function(level) {
            var intervals = [0, 1, 3, 7, 15, 30];
            var days = intervals[Math.min(level, 5)] || 0;
            var d = new Date();
            d.setDate(d.getDate() + days);
            return d.toISOString().slice(0, 10);
        },
        // 获取到期需复习的词
        getDueReviewIds: function() {
            var today = new Date().toISOString().slice(0, 10);
            var p = this.getWordsProgress();
            return Object.keys(p).filter(function(id) {
                var s = p[id];
                return s.nextReviewDate && s.nextReviewDate <= today && s.ebLevel >= 1;
            });
        },
        saveDailyQueue: function(words, pos) {
            var today = new Date().toISOString().slice(0, 10);
            return this.set('cet4_queue', { date: today, words: words, position: pos });
        },
        getDailyQueue: function() {
            var today = new Date().toISOString().slice(0, 10);
            var q = this.get('cet4_queue', null);
            return (q && q.date === today) ? q : null;
        },
        incTodayReviewed: function() {
            var today = new Date().toISOString().slice(0, 10);
            var s = this.getDailyStats();
            if (!s[today]) s[today] = { learned: 0, reviewed: 0 };
            s[today].reviewed++;
            return this.set('cet4_daily', s);
        },
        getCustomWords: function() { return this.get('cet4_custom', []); },
        addCustomWord: function(word, meaning) {
            var words = this.getCustomWords();
            var item = { id: 'c' + Date.now(), word: word.trim(), meaning: meaning.trim(), added: new Date().toISOString().slice(0, 10) };
            words.unshift(item);
            this.set('cet4_custom', words);
            return item;
        },
        removeCustomWord: function(id) {
            var words = this.getCustomWords().filter(function(w) { return w.id !== id; });
            return this.set('cet4_custom', words);
        },
        getBookmarked: function() { return this.get('cet4_bookmarks', []); },
        addBookmark: function(id) {
            var list = this.getBookmarked();
            if (list.indexOf(id) === -1) { list.push(id); this.set('cet4_bookmarks', list); }
        },
        removeBookmark: function(id) {
            var list = this.getBookmarked().filter(function(x) { return x !== id; });
            return this.set('cet4_bookmarks', list);
        },
        isBookmarked: function(id) { return this.getBookmarked().indexOf(id) !== -1; },
        getSettings: function() { return this.get('cet4_settings', { dailyGoal: 20 }); },
        saveSettings: function(s) { return this.set('cet4_settings', s); },
        exportAll: function() {
            return {
                wordsProgress: this.getWordsProgress(), dailyStats: this.getDailyStats(),
                customWords: this.getCustomWords(), bookmarked: this.getBookmarked(),
                settings: this.getSettings(), exportedAt: new Date().toISOString()
            };
        },
        importAll: function(data) {
            if (!data || typeof data !== 'object') return false;
            if (data.wordsProgress) this.set('cet4_progress', data.wordsProgress);
            if (data.dailyStats) this.set('cet4_daily', data.dailyStats);
            if (data.customWords) this.set('cet4_custom', data.customWords);
            if (data.bookmarked) this.set('cet4_bookmarks', data.bookmarked);
            if (data.settings) this.set('cet4_settings', data.settings);
            return true;
        },
        resetAll: function() {
            ['cet4_progress','cet4_daily','cet4_custom','cet4_bookmarks','cet4_settings','cet4_queue','cet4_quiz_state'].forEach(function(k) {
                localStorage.removeItem(k);
            });
        }
    };

    // ===================================================================
    // 主逻辑
    // ===================================================================
    (function() {
        try {
        // -- 状态 --
        var currentWord = null;
        var isFlipped = false;

        // -- 学词 --
        var wordCard = document.getElementById('wordCard');
        var elWordEn = document.getElementById('wordEn');
        var elPhonetic = document.getElementById('wordPhonetic');
        var elPos = document.getElementById('wordPos');
        var elMeaning = document.getElementById('wordMeaning');
        var elExample = document.getElementById('wordExample');
        var elFlipHint = document.getElementById('flipHint');
        var btnLearned = document.getElementById('btnLearned');
        var btnPrevWord = document.getElementById('btnPrevWord');
        var completeCard = document.getElementById('completeCard');
        var learnBtnGroup = document.getElementById('learnBtnGroup');

        var dailyQueue = null;
        var dailyPos = 0;

        function getNextWord() {
            var today = new Date().toISOString().slice(0, 10);
            var progress = Storage.getWordsProgress();

            // 恢复当天队列（刷新不丢失）
            if (!dailyQueue) {
                var saved = Storage.getDailyQueue();
                if (saved && saved.words && saved.words.length > 0) {
                    dailyQueue = saved.words;
                    dailyPos = saved.position || 0;
                } else {
                    // 首次生成
                    var learnedIds = Storage.getLearnedWordIds();
                    var remaining = WORDS.filter(function(w) {
                        return learnedIds.indexOf(w.id) === -1;
                    });
                    shuffle(remaining);
                    dailyQueue = remaining.map(function(w) { return w.id; });
                    dailyPos = 0;
                    Storage.saveDailyQueue(dailyQueue, dailyPos);
                }
            }

            // 从队列取下一个
            while (dailyPos < dailyQueue.length) {
                var wid = dailyQueue[dailyPos];
                var w = WORDS.find(function(x) { return x.id === wid; });
                if (!w) { dailyPos++; continue; }
                var s = progress[wid];
                if (s && s.status === 'learned') { dailyPos++; continue; }
                if (s && s.status === 'need_review' && s.lastReview === today) { dailyPos++; continue; }
                // 找到，推进位置并保存
                var word = w;
                dailyPos++;
                Storage.saveDailyQueue(dailyQueue, dailyPos);
                // 也保存当前词，刷新可恢复
                Storage.set('cet4_current_word', { id: word.id, pos: dailyPos - 1 });
                return word;
            }
            return null;
        }

        function renderWordCard(word) {
            currentWord = word;
            isFlipped = false;
            elWordEn.textContent = word.word;
            elPhonetic.textContent = word.phonetic;
            elPos.textContent = word.pos;
            elMeaning.textContent = '? ? ?';
            elExample.textContent = '';
            elFlipHint.textContent = '点击卡片翻转查看释义';
            elFlipHint.style.display = 'block';
            wordCard.classList.remove('flipped');
            document.getElementById('memoryTipBox').style.display = 'none';
            document.getElementById('btnSpeakExample').style.display = 'none';
        }

        function showMemoryTip(word) {
            var tipBox = document.getElementById('memoryTipBox');
            var tipContent = document.getElementById('memoryTipContent');
            if (word.memoryTip) {
                tipContent.innerHTML = word.memoryTip;
                tipBox.style.display = 'block';
            } else {
                tipBox.style.display = 'none';
            }
        }

        function flipCard() {
            if (!currentWord) return;
            isFlipped = true;
            elMeaning.textContent = currentWord.meaning;
            elExample.textContent = currentWord.example;
            elFlipHint.style.display = 'none';
            wordCard.classList.add('flipped');
            showMemoryTip(currentWord);
            document.getElementById('btnSpeakExample').style.display = 'inline';
        }

        wordCard.addEventListener('click', function() {
            if (currentWord && !isFlipped) flipCard();
        });

        // 不认识按钮 → 标记 need_review + 自动收入生词本 + 跳过
        var btnUnknown = document.getElementById('btnUnknown');
        btnUnknown.addEventListener('click', function() {
            if (!currentWord) return;
            var today = new Date().toISOString().slice(0, 10);
            Storage.updateWordStatus(currentWord.id, {
                status: 'need_review', lastReview: today,
                ebLevel: 0, nextReviewDate: today
            });
            if (!Storage.isBookmarked(currentWord.id)) {
                Storage.addBookmark(currentWord.id);
            }
            // 也加入今日记录（但不计入进度数字）
            Storage.incTodayLearned(currentWord.id, false);
            updateProgress();
            showNextOrComplete();
        });

        btnLearned.addEventListener('click', function() {
            if (!currentWord) return;
            var today = new Date().toISOString().slice(0, 10);
            Storage.updateWordStatus(currentWord.id, {
                status: 'learned', lastReview: today,
                ebLevel: 1, nextReviewDate: Storage.getEbbinghausNextDate(1)
            });
            Storage.incTodayLearned(currentWord.id, true);
            updateProgress();
            showNextOrComplete();
        });

        // 例句发音
        document.getElementById('btnSpeakExample').addEventListener('click', function(e) {
            e.stopPropagation();
            if (currentWord) {
                // 去掉中文部分只读英文
                var enOnly = currentWord.example.replace(/（[^）]*）/g, '').replace(/\([^)]*\)/g, '').trim();
                speakSentence(enOnly);
            }
        });

        // 点击单词发音（英式英语）
        wordCard.addEventListener('dblclick', function(e) {
            if (!currentWord) return;
            e.stopPropagation();
            speakWord(currentWord.word);
        });
        // 也可以点击卡片上的喇叭图标
        var elSpeak = document.getElementById('btnSpeak');
        if (elSpeak) {
            elSpeak.addEventListener('click', function(e) {
                e.stopPropagation();
                if (currentWord) speakWord(currentWord.word);
            });
        }

        // 预加载语音列表（安全模式）
        var cachedGBVoice = null;
        try {
            if (window.speechSynthesis) {
                speechSynthesis.onvoiceschanged = function() {
                    var voices = speechSynthesis.getVoices();
                    if (voices && voices.find) {
                        cachedGBVoice = voices.find(function(v) { return v.lang === 'en-GB'; }) || null;
                    }
                };
                speechSynthesis.getVoices();
            }
        } catch(e) {}

        function speakWord(text) {
            if (!window.speechSynthesis) { showToast('你的浏览器不支持发音'); return; }
            window.speechSynthesis.cancel();
            var utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-GB';
            utterance.rate = 0.9;
            utterance.volume = 1;
            if (cachedGBVoice) utterance.voice = cachedGBVoice;
            speechSynthesis.speak(utterance);
        }
        function speakSentence(text) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            var utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-GB';
            utterance.rate = 0.8;
            utterance.volume = 1;
            if (cachedGBVoice) utterance.voice = cachedGBVoice;
            speechSynthesis.speak(utterance);
        }
        window._speak = speakWord;

        // 上一个单词
        var wordHistory = [];
        btnPrevWord.addEventListener('click', function() {
            if (wordHistory.length === 0) { showToast('没有上一个单词了'); return; }
            var prev = wordHistory.pop();
            // 把当前单词放回去（如果存在）
            if (currentWord && currentWord !== prev) {
                wordHistory.push(currentWord);
            }
            renderWordCard(prev);
        });

        function clearWordHistory() {
            wordHistory = [];
        }

        function showNextOrComplete() {
            // 把当前单词推入历史
            if (currentWord) {
                wordHistory.push(currentWord);
                if (wordHistory.length > 50) wordHistory.shift(); // 最多保留50个
            }
            var next = getNextWord();
            if (!next) {
                wordCard.style.display = 'none';
                learnBtnGroup.style.display = 'none';
                completeCard.style.display = 'block';
            } else {
                wordCard.style.display = 'flex';
                learnBtnGroup.style.display = 'flex';
                completeCard.style.display = 'none';
                renderWordCard(next);
            }
        }

        function updateProgress() {
            renderTodayLearned();
        }

        function renderTodayLearned() {
            var ids = Storage.getTodayLearnedIds();
            document.getElementById('todayLearnedCount').textContent = ids.length;
            var list = document.getElementById('todayLearnedList');
            var empty = document.getElementById('todayLearnedEmpty');
            if (ids.length === 0) {
                list.innerHTML = '';
                empty.style.display = 'block';
            } else {
                empty.style.display = 'none';
                var html = '';
                var progress = Storage.getWordsProgress();
                ids.forEach(function(id) {
                    var w = WORDS.find(function(x) { return x.id === id; });
                    if (!w) return;
                    var s = progress[id];
                    var bg = (s && s.status === 'need_review') ? '#FFF3E0' : '#E8F5E9';
                    var tag = (s && s.status === 'need_review') ? '<span style="color:#E65100;font-size:10px;"> 不认识</span>' : '<span style="color:#2E7D32;font-size:10px;"> 认识</span>';
                    html += '<span style="display:inline-block;margin:3px 6px;padding:3px 12px;background:' + bg + ';border-radius:14px;font-size:13px;">' + w.word + ' <span style="color:#757575;">' + w.meaning + '</span>' + tag + '</span>';
                });
                list.innerHTML = html;
            }
        }

        // -- 复习 --
        var quizWord = document.getElementById('quizWord');
        // 点击题目单词发音
        quizWord.addEventListener('click', function() {
            if (quizState.currentQuestion) speakWord(quizState.currentQuestion.word);
        });
        var quizOptions = document.getElementById('quizOptions');
        var quizFeedback = document.getElementById('quizFeedback');
        var btnNextQuiz = document.getElementById('btnNextQuiz');
        var btnPrevQuiz = document.getElementById('btnPrevQuiz');
        var quizNavBtns = document.getElementById('quizNavBtns');
        var quizCorrect = document.getElementById('quizCorrect');
        var quizWrong = document.getElementById('quizWrong');
        var quizTotal = document.getElementById('quizTotal');
        var quizCard = document.getElementById('quizCard');
        var quizEmpty = document.getElementById('quizEmpty');
        var quizStats = document.getElementById('quizStats');
        var quizState = { correctCount: 0, totalCount: 0, currentQuestion: null, answered: false };
        var quizQuestions = [];   // 预生成题目列表
        var quizIndex = -1;       // 当前题目位置

        function initQuiz() {
            var dueIds = Storage.getDueReviewIds();
            var todayIds = Storage.getReviewableIds();
            var allIds = dueIds.concat(todayIds.filter(function(id) { return dueIds.indexOf(id) === -1; }));
            if (allIds.length === 0) {
                quizCard.style.display = 'none';
                quizStats.style.display = 'none';
                quizEmpty.style.display = 'block';
                return;
            }
            quizCard.style.display = 'block';
            quizStats.style.display = 'flex';
            quizEmpty.style.display = 'none';

            // 尝试恢复上次复习进度，过滤掉今天已答过的
            var saved = Storage.get('cet4_quiz_state', null);
            if (saved && saved.questions && saved.questions.length > 0) {
                var unanswered = saved.questions.filter(function(q) { return !q.answered; });
                if (unanswered.length === 0) {
                    // 全部答完，重新生成
                    saved = null;
                }
            }
            if (saved && saved.questions && saved.questions.length > 0) {
                quizState.correctCount = saved.correctCount || 0;
                quizState.totalCount = saved.totalCount || 0;
                quizQuestions = saved.questions.map(function(q) {
                    var word = WORDS.find(function(w) { return w.id === q.wordId; });
                    var others = WORDS.filter(function(w) { return w.id !== q.wordId; });
                    shuffle(others);
                    return { word: word, distractors: others.slice(0, 3), answered: q.answered, isCorrect: q.isCorrect };
                });
                quizIndex = saved.quizIndex >= 0 ? saved.quizIndex : 0;
                renderQuizQuestion();
            } else {
                buildQuestionPool();
                quizIndex = -1;
                goNextQuestion();
            }
            updateQuizStats();
        }

        function buildQuestionPool() {
            var dueIds = Storage.getDueReviewIds();
            var reviewIds = Storage.getReviewableIds();
            // 到期词优先，然后其他可复习词
            var allIds = dueIds.concat(reviewIds.filter(function(id) { return dueIds.indexOf(id) === -1; }));
            var needWords = [];
            allIds.forEach(function(id) {
                var w = WORDS.find(function(x) { return x.id === id; });
                if (w && needWords.indexOf(w) === -1) needWords.push(w);
            });
            quizQuestions = [];
            var count = Math.min(30, needWords.length);
            for (var i = 0; i < count; i++) {
                var word = needWords[i];
                var others = WORDS.filter(function(w) { return w.id !== word.id; });
                shuffle(others);
                quizQuestions.push({ word: word, distractors: others.slice(0, 3) });
            }
        }

        function goNextQuestion() {
            // 跳过已答过的题
            var nextIdx = quizIndex + 1;
            while (nextIdx < quizQuestions.length && quizQuestions[nextIdx].answered) {
                nextIdx++;
            }
            if (nextIdx < quizQuestions.length) {
                quizIndex = nextIdx;
                renderQuizQuestion();
            } else if (quizQuestions.filter(function(q) { return !q.answered; }).length === 0) {
                // 全部答完
                quizFeedback.textContent = '';
                quizOptions.innerHTML = '';
                quizWord.textContent = '已完成';
                quizNavBtns.style.display = 'none';
                document.getElementById('quizFeedback').innerHTML = '<div style="padding:20px;color:#4CAF50;font-size:18px;">&#127881; 今天的词复习完毕！</div>';
                Storage.set('cet4_quiz_state', null);
            } else {
                // 追加未答新题
                var dueIds = Storage.getDueReviewIds();
                var todayIds = Storage.getReviewableIds();
                var allNeedIds = dueIds.concat(todayIds.filter(function(id) { return dueIds.indexOf(id) === -1; }));
                var answeredIds = quizQuestions.map(function(q) { return q.word.id; });
                var needWords = WORDS.filter(function(w) { return allNeedIds.indexOf(w.id) !== -1 && answeredIds.indexOf(w.id) === -1; });
                if (needWords.length === 0) {
                    quizFeedback.textContent = '';
                    quizOptions.innerHTML = '';
                    quizWord.textContent = '';
                    quizNavBtns.style.display = 'none';
                    document.getElementById('quizFeedback').innerHTML = '<div style="padding:20px;color:#4CAF50;font-size:18px;">&#127881; 今天的词复习完毕！</div>';
                    Storage.set('cet4_quiz_state', null);
                    return;
                }
                shuffle(needWords);
                var word = needWords[0];
                var others = WORDS.filter(function(w) { return w.id !== word.id; });
                shuffle(others);
                quizQuestions.push({ word: word, distractors: others.slice(0, 3) });
                quizIndex++;
                renderQuizQuestion();
            }
        }

        function goPrevQuestion() {
            if (quizIndex > 0) {
                quizIndex--;
                renderQuizQuestion();
            } else {
                showToast('已经是第一题了');
            }
        }

        function renderQuizQuestion() {
            var q = quizQuestions[quizIndex];
            var correctWord = q.word;
            var wasAnswered = q.answered || false;
            quizState.currentQuestion = correctWord;
            quizState.answered = wasAnswered;
            quizWord.textContent = correctWord.word;
            quizNavBtns.style.display = 'flex';

            var options = [correctWord].concat(q.distractors);
            shuffle(options);

            quizOptions.innerHTML = '';
            options.forEach(function(opt) {
                var btn = document.createElement('button');
                btn.className = 'quiz-option';
                btn.textContent = opt.meaning;
                if (wasAnswered) {
                    btn.style.pointerEvents = 'none';
                    if (opt.id === correctWord.id) btn.classList.add('correct');
                } else {
                    btn.addEventListener('click', function() {
                        if (quizState.answered) return;
                        handleAnswer(opt.id === correctWord.id, correctWord.meaning, btn);
                    });
                }
                quizOptions.appendChild(btn);
            });

            if (wasAnswered) {
                var wasCorrect = q.isCorrect;
                if (wasCorrect) {
                    quizFeedback.innerHTML = '<span style="color:#4CAF50;">&#10004; 已答对</span>';
                } else {
                    quizFeedback.innerHTML = '<span style="color:#F44336;font-weight:600;">&#10008; 答错了</span>&nbsp;&nbsp;<span style="color:#757575;">正确答案：</span><b style="color:#4CAF50;">' + correctWord.meaning + '</b>';
                }
            } else {
                quizFeedback.textContent = '';
            }
        }

        function handleAnswer(isCorrect, correctMeaning, clickedBtn) {
            quizState.answered = true;
            quizState.totalCount++;
            // 标记当前题作答结果
            if (quizQuestions[quizIndex]) {
                quizQuestions[quizIndex].answered = true;
                quizQuestions[quizIndex].isCorrect = isCorrect;
            }
            var allOpts = quizOptions.querySelectorAll('.quiz-option');
            allOpts.forEach(function(btn) {
                if (btn.textContent === correctMeaning) btn.classList.add('correct');
            });
            if (isCorrect) {
                quizState.correctCount++;
                quizFeedback.innerHTML = '<span style="font-size:16px;color:#4CAF50;">&#10004; 正确</span>';
                var cur = Storage.getWordStatus(quizState.currentQuestion.id);
                var newLevel = Math.min((cur.ebLevel || 0) + 1, 5);
                Storage.updateWordStatus(quizState.currentQuestion.id, {
                    correct: (cur.correct || 0) + 1,
                    ebLevel: newLevel,
                    nextReviewDate: Storage.getEbbinghausNextDate(newLevel)
                });
            } else {
                clickedBtn.classList.add('wrong');
                quizFeedback.innerHTML = '<div style="color:#F44336;font-size:16px;margin-bottom:4px;">&#10008; 错误</div><div style="font-size:15px;">正确答案：<b style="color:#4CAF50;">' + correctMeaning + '</b></div>';
                var cur2 = Storage.getWordStatus(quizState.currentQuestion.id);
                Storage.updateWordStatus(quizState.currentQuestion.id, {
                    wrong: (cur2.wrong || 0) + 1,
                    ebLevel: 0,
                    nextReviewDate: Storage.getEbbinghausNextDate(0)
                });
                // 错题自动收录
                if (!Storage.isBookmarked(quizState.currentQuestion.id)) {
                    Storage.addBookmark(quizState.currentQuestion.id);
                }
            }
            Storage.incTodayReviewed();
            updateQuizStats();
            quizNavBtns.style.display = 'flex';
        }

        function updateQuizStats() {
            quizCorrect.textContent = quizState.correctCount;
            quizWrong.textContent = quizState.totalCount - quizState.correctCount;
            quizTotal.textContent = quizState.totalCount;
            // 持久化复习进度
            Storage.set('cet4_quiz_state', {
                correctCount: quizState.correctCount,
                totalCount: quizState.totalCount,
                quizIndex: quizIndex,
                questions: quizQuestions.map(function(q) { return { wordId: q.word.id, answered: q.answered, isCorrect: q.isCorrect }; })
            });
        }

        btnNextQuiz.addEventListener('click', goNextQuestion);
        btnPrevQuiz.addEventListener('click', goPrevQuestion);

        function shuffle(arr) {
            for (var i = arr.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
            }
        }

        // -- 生词本 --
        var wordbookList = document.getElementById('wordbookList');
        var wordbookEmpty = document.getElementById('wordbookEmpty');

        function renderWordbook() {
            var customWords = Storage.getCustomWords();
            var bookmarkedIds = Storage.getBookmarked();
            var bookmarkedWords = WORDS.filter(function(w) { return bookmarkedIds.indexOf(w.id) !== -1; });
            var progress = Storage.getWordsProgress();
            var total = customWords.length + bookmarkedWords.length;
            wordbookEmpty.style.display = total === 0 ? 'block' : 'none';

            // 统计错误词
            var errCount = 0;
            bookmarkedWords.forEach(function(w) { var s = progress[w.id]; if (s && s.wrong > 0) errCount++; });
            document.getElementById('wbErrorCount').textContent = errCount;

            var html = '';
            bookmarkedWords.forEach(function(w) {
                var s = progress[w.id];
                var wrongInfo = (s && s.wrong > 0) ? ' <span style="color:#F44336;font-size:11px;">错' + s.wrong + '次</span>' : '';
                html += makeItem(w.id, w.word, w.meaning + wrongInfo, true);
            });
            customWords.forEach(function(w) {
                html += makeItem(w.id, w.word, w.meaning, false);
            });
            wordbookList.innerHTML = html;

            wordbookList.querySelectorAll('.btn-delete-word').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    var id = this.getAttribute('data-id');
                    var builtin = this.getAttribute('data-builtin') === 'true';
                    if (builtin) { Storage.removeBookmark(id); showToast('已从生词本移除'); }
                    else { Storage.removeCustomWord(id); showToast('已删除'); }
                    renderWordbook();
                });
            });
        }

        function makeItem(id, word, meaning, builtin) {
            var tag = builtin ? '<span class="badge">词库</span>' : '';
            return '<div class="wordbook-item"><div style="flex:1;"><div style="font-size:16px;font-weight:600;">' + word + ' <span style="cursor:pointer;font-size:18px;" onclick="event.stopPropagation();window._speak(\'' + word + '\')">&#128266;</span> ' + tag + '</div><div style="font-size:14px;color:#757575;margin-top:2px;">' + meaning + '</div></div><button class="btn btn-danger btn-sm btn-delete-word" data-id="' + id + '" data-builtin="' + builtin + '">删除</button></div>';
        }

        document.getElementById('btnAddWord').addEventListener('click', function() {
            var w = document.getElementById('inputNewWord').value.trim();
            var m = document.getElementById('inputNewMeaning').value.trim();
            if (!w) { showToast('请输入英文单词'); return; }
            if (!m) { showToast('请输入中文释义'); return; }
            Storage.addCustomWord(w, m);
            document.getElementById('inputNewWord').value = '';
            document.getElementById('inputNewMeaning').value = '';
            showToast('已添加生词');
            renderWordbook();
        });

        // -- 生词测试 --
        var wbQuizState = { correctCount: 0, totalCount: 0, currentWord: null, answered: false };
        var wbQuizWords = [];
        var wbQuizIndex = -1;

        document.getElementById('btnStartWbQuiz').addEventListener('click', function() {
            var bookmarkedIds = Storage.getBookmarked();
            var customWords = Storage.getCustomWords();
            var allWords = [];
            // 内置词库收藏
            WORDS.filter(function(w) { return bookmarkedIds.indexOf(w.id) !== -1; }).forEach(function(w) {
                allWords.push({ word: w.word, meaning: w.meaning, id: w.id });
            });
            // 手动添加
            customWords.forEach(function(w) {
                allWords.push({ word: w.word, meaning: w.meaning, id: w.id });
            });
            if (allWords.length === 0) { showToast('生词本还没有单词'); return; }
            if (allWords.length < 2) { showToast('至少需要2个生词才能测试'); return; }

            wbQuizWords = allWords.slice();
            shuffle(wbQuizWords);
            wbQuizState = { correctCount: 0, totalCount: 0, currentWord: null, answered: false };
            wbQuizIndex = -1;
            document.getElementById('wbQuizArea').style.display = 'none';
            document.getElementById('wbQuizQuestion').style.display = 'block';
            document.getElementById('wbQuizResult').style.display = 'none';
            wbGoNext();
        });

        function wbGoNext() {
            if (wbQuizIndex < wbQuizWords.length - 1) {
                wbQuizIndex++;
                wbRenderQuestion();
            } else {
                wbShowResult();
            }
        }

        function wbGoPrev() {
            if (wbQuizIndex > 0) {
                wbQuizIndex--;
                wbRenderQuestion();
            } else {
                showToast('已经是第一题了');
            }
        }

        function wbRenderQuestion() {
            var q = wbQuizWords[wbQuizIndex];
            wbQuizState.currentWord = q;
            wbQuizState.answered = q.answered || false;
            document.getElementById('wbQuizWord').textContent = q.word;
            document.getElementById('wbQuizFeedback').textContent = '';
            document.getElementById('wbQuizNavBtns').style.display = 'flex';

            // 生成干扰项
            var others = wbQuizWords.filter(function(w) { return w.id !== q.id; });
            if (others.length < 3) {
                // 补充词库中的随机词
                var extra = WORDS.filter(function(w) { return w.id !== q.id && !wbQuizWords.some(function(x) { return x.id === w.id; }); });
                shuffle(extra);
                while (others.length < 3 && extra.length > 0) {
                    var e = extra.shift();
                    others.push({ word: e.word, meaning: e.meaning, id: e.id });
                }
            }
            shuffle(others);
            var options = [q].concat(others.slice(0, 3));
            shuffle(options);

            var html = '';
            var self = this;
            options.forEach(function(opt) {
                var cls = 'quiz-option';
                if (wbQuizState.answered) {
                    cls += (opt.id === q.id) ? ' correct' : '';
                }
                html += '<button class="' + cls + '" style="' + (wbQuizState.answered ? 'pointer-events:none;' : '') + '" data-id="' + opt.id + '">' + opt.meaning + '</button>';
            });
            document.getElementById('wbQuizOptions').innerHTML = html;

            if (!wbQuizState.answered) {
                document.querySelectorAll('#wbQuizOptions .quiz-option').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        if (wbQuizState.answered) return;
                        var isCorrect = this.getAttribute('data-id') === q.id;
                        wbQuizState.answered = true;
                        wbQuizState.totalCount++;
                        wbQuizWords[wbQuizIndex].answered = true;
                        wbQuizWords[wbQuizIndex].isCorrect = isCorrect;
                        document.querySelectorAll('#wbQuizOptions .quiz-option').forEach(function(b) {
                            if (b.getAttribute('data-id') === q.id) b.classList.add('correct');
                            b.style.pointerEvents = 'none';
                        });
                        if (!isCorrect) this.classList.add('wrong');
                        if (isCorrect) {
                            wbQuizState.correctCount++;
                            document.getElementById('wbQuizFeedback').innerHTML = '<span style="color:#4CAF50;">&#10004; 正确</span>';
                        } else {
                            document.getElementById('wbQuizFeedback').innerHTML = '<div style="color:#F44336;">&#10008; 错误</div><div style="font-size:14px;">正确答案：<b style="color:#4CAF50;">' + q.meaning + '</b></div>';
                        }
                    });
                });
            } else {
                if (q.isCorrect) {
                    document.getElementById('wbQuizFeedback').innerHTML = '<span style="color:#4CAF50;">&#10004; 已答对</span>';
                } else {
                    document.getElementById('wbQuizFeedback').innerHTML = '<span style="color:#F44336;font-weight:600;">&#10008; 答错了</span>&nbsp;&nbsp;正确答案：<b style="color:#4CAF50;">' + q.meaning + '</b>';
                }
            }

            // 发音
            document.getElementById('wbQuizWord').onclick = function() { speakWord(q.word); };
        }

        function wbShowResult() {
            document.getElementById('wbQuizQuestion').style.display = 'none';
            var res = document.getElementById('wbQuizResult');
            res.style.display = 'block';
            var wrongList = wbQuizWords.filter(function(w) { return w.answered && !w.isCorrect; });
            var html = '<div style="font-size:18px;font-weight:600;margin-bottom:12px;">测试完成</div>';
            html += '<div style="margin-bottom:8px;">正确：<b style="color:#4CAF50;">' + wbQuizState.correctCount + '</b> / 共 ' + wbQuizState.totalCount + ' 题</div>';
            if (wrongList.length > 0) {
                html += '<div style="margin-top:12px;text-align:left;"><b style="color:#F44336;">需要加强的词：</b></div>';
                wrongList.forEach(function(w) {
                    html += '<div style="padding:6px 0;border-bottom:1px solid #F5F5F5;">' + w.word + ' → ' + w.meaning + '</div>';
                });
            } else {
                html += '<div style="color:#4CAF50;margin-top:8px;">&#127881; 全部正确！生词都掌握了！</div>';
            }
            html += '<button class="btn btn-primary btn-block" id="btnRetryWbQuiz" style="margin-top:14px;">重新测试</button>';
            res.innerHTML = html;
            document.getElementById('btnRetryWbQuiz').addEventListener('click', function() {
                document.getElementById('wbQuizArea').style.display = 'block';
                document.getElementById('wbQuizQuestion').style.display = 'none';
            });
        }

        document.getElementById('btnWbNext').addEventListener('click', wbGoNext);
        document.getElementById('btnWbPrev').addEventListener('click', wbGoPrev);

        // -- 语法 --
        var grammarContent = document.getElementById('grammarContent');

        function renderGrammar() {
            if (grammarContent.children.length > 0) return;
            var cats = {};
            GRAMMAR.forEach(function(g) {
                if (!cats[g.category]) cats[g.category] = [];
                cats[g.category].push(g);
            });
            var html = '';
            for (var cat in cats) {
                html += '<div class="card"><div class="card-title">' + cat + '</div>';
                cats[cat].forEach(function(item) {
                    var examHtml = item.examPoint ? '<div style="margin-top:12px;padding:10px 14px;background:#FFF8E1;border-radius:8px;font-size:13px;line-height:1.7;"><b>&#127891; 四级考点：</b>' + item.examPoint + '</div>' : '';
                var pitfallHtml = item.pitfall ? '<div style="margin-top:8px;padding:10px 14px;background:#FFEBEE;border-radius:8px;font-size:13px;line-height:1.7;"><b>&#9888; 常见误区：</b>' + item.pitfall + '</div>' : '';
                html += '<div class="grammar-category"><div class="grammar-header" data-gid="' + item.id + '"><span style="font-weight:600;">' + item.title + '</span><span style="color:#757575;font-size:12px;">&#9660;</span></div><div class="grammar-body" id="grammar-' + item.id + '"><p style="line-height:1.9;">' + item.content + '</p><p style="color:#1976D2;margin-top:8px;font-style:italic;">' + item.example.replace(/\n/g, '<br>') + '</p>' + examHtml + pitfallHtml + '</div></div>';
                });
                html += '</div>';
            }
            grammarContent.innerHTML = html;
            grammarContent.querySelectorAll('.grammar-header').forEach(function(h) {
                h.addEventListener('click', function() {
                    var body = document.getElementById('grammar-' + this.getAttribute('data-gid'));
                    body.classList.toggle('open');
                    this.querySelector('span:last-child').textContent = body.classList.contains('open') ? '▲' : '▼';
                });
            });
        }

        // -- 词库 --
        var vocabSearch = document.getElementById('vocabSearch');
        var vocabList = document.getElementById('vocabList');
        var vocabCount = document.getElementById('vocabCount');
        var vocabCatFilter = 'all';

        function renderVocab() {
            var query = (vocabSearch.value || '').trim().toLowerCase();
            var filtered = WORDS;
            // 分类筛选
            if (vocabCatFilter !== 'all') {
                filtered = filtered.filter(function(w) {
                    return getWordCategory(w).code === vocabCatFilter;
                });
            }
            // 搜索
            if (query) {
                filtered = filtered.filter(function(w) {
                    return w.word.toLowerCase().indexOf(query) !== -1 || w.meaning.indexOf(query) !== -1;
                });
            }
            vocabCount.textContent = filtered.length;

            var progress = Storage.getWordsProgress();
            var EB_NAMES = ['新词','初学','巩固','强化','稳定','掌握'];
            var EB_COLORS = ['#9E9E9E','#FF9800','#FFC107','#4CAF50','#2196F3','#1565C0'];
            var html = '';
            filtered.forEach(function(w) {
                var s = progress[w.id];
                var cat = getWordCategory(w);
                var ebHtml = '';
                if (s && s.ebLevel >= 1) {
                    ebHtml = '<span style="font-size:10px;color:' + EB_COLORS[s.ebLevel] + ';margin-left:4px;">L' + s.ebLevel + '</span>';
                }
                html += '<div class="vocab-item"><div class="vocab-item-left"><div class="vocab-word-row"><span class="vocab-word">' + w.word + '</span> <span style="cursor:pointer;font-size:16px;line-height:1;" onclick="event.stopPropagation();window._speak(\'' + w.word + '\')">&#128266;</span>' + ebHtml + ' <span class="vocab-status" style="background:' + (cat.num === 1 ? '#FFEBEE' : cat.num === 2 ? '#FFF3E0' : cat.num === 3 ? '#E3F2FD' : '#F5F5F5') + ';color:' + (cat.num === 1 ? '#C62828' : cat.num === 2 ? '#E65100' : cat.num === 3 ? '#1565C0' : '#757575') + ';">' + cat.name + '</span></div><div class="vocab-meaning">' + w.meaning + '</div></div></div>';
            });

            if (filtered.length === 0) {
                html = '<div class="empty-state"><div class="empty-state-text">没有匹配的单词</div></div>';
            }
            vocabList.innerHTML = html;
        }

        vocabSearch.addEventListener('input', renderVocab);

        // 分类筛选按钮
        document.querySelectorAll('.vocab-filter').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.vocab-filter').forEach(function(b) { b.classList.remove('active'); });
                this.classList.add('active');
                vocabCatFilter = this.getAttribute('data-cat');
                renderVocab();
            });
        });

        // -- 设置 --
        var settingsModal = document.getElementById('settingsModal');
        document.getElementById('btnSettings').addEventListener('click', function() {
            document.getElementById('inputDailyGoal').value = Storage.getSettings().dailyGoal;
            settingsModal.style.display = 'flex';
        });
        document.getElementById('btnCloseSettings').addEventListener('click', function() { settingsModal.style.display = 'none'; });
        settingsModal.addEventListener('click', function(e) { if (e.target === settingsModal) settingsModal.style.display = 'none'; });
        document.getElementById('btnSaveGoal').addEventListener('click', function() {
            var g = parseInt(document.getElementById('inputDailyGoal').value) || 20;
            g = Math.max(5, Math.min(100, g));
            Storage.saveSettings({ dailyGoal: g });
            updateProgress();
            settingsModal.style.display = 'none';
            showToast('每日目标已更新为 ' + g + ' 个');
        });
        document.getElementById('btnExport').addEventListener('click', function() {
            var data = Storage.exportAll();
            var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'cet4_backup_' + new Date().toISOString().slice(0,10) + '.json';
            a.click();
            showToast('数据已导出');
        });
        document.getElementById('btnImport').addEventListener('click', function() { document.getElementById('importFile').click(); });
        document.getElementById('importFile').addEventListener('change', function() {
            var file = this.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var data = JSON.parse(e.target.result);
                    if (confirm('确定要导入数据吗？当前数据将被覆盖。')) {
                        Storage.importAll(data);
                        showToast('数据已导入，页面将刷新');
                        setTimeout(function() { location.reload(); }, 1500);
                    }
                } catch(err) { showToast('文件格式不正确'); }
            };
            reader.readAsText(file);
            this.value = '';
        });
        document.getElementById('btnReset').addEventListener('click', function() {
            if (confirm('确定要删除所有学习数据吗？此操作不可恢复！\n\n建议先导出备份。')) {
                Storage.resetAll();
                showToast('数据已重置，页面将刷新');
                setTimeout(function() { location.reload(); }, 1500);
            }
        });

        // -- 标签切换 --
        var tabs = document.querySelectorAll('.nav-tab');
        var panels = document.querySelectorAll('.panel');
        function switchTab(name) {
            tabs.forEach(function(t) { t.classList.toggle('active', t.getAttribute('data-tab') === name); });
            panels.forEach(function(p) { p.classList.toggle('active', p.id === name + '-panel'); });
            if (name === 'learn') updateProgress();
            if (name === 'review') initQuiz();
            if (name === 'wordbook') renderWordbook();
            if (name === 'grammar') renderGrammar();
            if (name === 'vocab') renderVocab();
        }
        tabs.forEach(function(t) {
            t.addEventListener('click', function() { switchTab(this.getAttribute('data-tab')); });
        });

        // -- Toast --
        function showToast(msg) {
            var old = document.querySelector('.toast');
            if (old) old.remove();
            var t = document.createElement('div');
            t.className = 'toast';
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(function() { t.remove(); }, 2000);
        }

        // -- 初始化 --
        function updateReviewBadge() {
            var due = Storage.getDueReviewIds();
            var badge = document.getElementById('reviewBadge');
            if (due.length > 0) {
                badge.textContent = due.length;
                badge.style.display = 'inline';
            } else {
                badge.style.display = 'none';
            }
        }

        function init() {
            updateReviewBadge();
            switchTab('learn');
            var word = getNextWord();
            if (word) {
                renderWordCard(word);
            } else {
                wordCard.style.display = 'none';
                learnBtnGroup.style.display = 'none';
                completeCard.style.display = 'block';
            }
            updateProgress();
        }

        init();
        console.log('English Learning 已就绪 — ' + WORDS.length + ' 个内置单词');
        } catch(e) {
            document.body.innerHTML = '<div style="text-align:center;padding:100px 20px;font-size:18px;color:#F44336;"><b>加载失败</b><p style="color:#757575;font-size:14px;">请用Chrome浏览器打开此文件</p></div>';
            console.error(e);
        }
    })();
    </script>
</body>
</html>
